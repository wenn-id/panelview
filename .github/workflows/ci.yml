name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # zero-build repo: CI runs the static files, it never builds them
      - name: Browser suite + Comic Sol parity
        run: node tools/run-tests.mjs test.html tools/parity.html
      # the runner is CI infrastructure, so its own failure mode is gated too
      - name: Runner crash regression
        run: node tools/crash-check.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-screenshots
          path: shots/
          if-no-files-found: ignore

  fixture-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Committed fixture still matches the pinned comicsol ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/fetch-fixture.mjs --check
